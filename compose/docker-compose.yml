# ==============================================================================
# RECONSTRUCTED CONSOLIDATED COMPOSE TEMPLATE
#
# Provenance:
# The live application services were deployed as separate Compose stacks through
# Portainer CE. This repository-level Compose file was created later to collect
# the verified service definitions into one reviewable/reproducible template.
#
# It is NOT the original single deployment source used by the live environment.
# Application bind-mount paths below reflect the documented TrueNAS-backed Ubuntu
# mount at /mnt/truenas_data. Portainer itself is intentionally not included here
# because it is the management plane used to deploy/manage the application stacks.
# ==============================================================================

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /mnt/truenas_data/npm/data:/data
      - /mnt/truenas_data/npm/letsencrypt:/etc/letsencrypt

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"
    environment:
      TZ: Europe/Istanbul
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:?PIHOLE_PASSWORD must be defined in .env}"

      # Reconstructed Compose compatibility requirement for Pi-hole v6 when
      # attached to Docker's default bridge network. This setting was not
      # independently preserved as an original live deployment value.
      FTLCONF_dns_listeningMode: "ALL"

    volumes:
      - /mnt/truenas_data/pihole/etc-pihole:/etc/pihole

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /mnt/truenas_data/nextcloud/data:/var/www/html/data

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2223:22"
    volumes:
      - /mnt/truenas_data/gitea:/data
