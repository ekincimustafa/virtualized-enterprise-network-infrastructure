# ==============================================================================
# RECONSTRUCTED CONFIGURATION TEMPLATE BASED ON VERIFIED LIVE SETTINGS
#
# Note: In the live environment, services were deployed via Portainer CE and
# individual container tasks. This Compose file reconstructs the verified
# service definitions, port bindings, and decoupled TrueNAS NFS mounts, with
# clearly documented compatibility adjustments required for the reconstructed
# Compose deployment.
# ==============================================================================

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /mnt/truenas_data/npm/data:/data
      - /mnt/truenas_data/npm/letsencrypt:/etc/letsencrypt

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"
    environment:
      TZ: Europe/Istanbul
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:?PIHOLE_PASSWORD must be defined in .env}"

      # Reconstructed Compose deployment compatibility requirement:
      # Required for Pi-hole v6 on Docker's default bridge network.
      FTLCONF_dns_listeningMode: 'ALL'

    volumes:
      - /mnt/truenas_data/pihole/etc-pihole:/etc/pihole

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /mnt/truenas_data/nextcloud/data:/var/www/html/data

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /mnt/truenas_data/gitea:/data